<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Assistant</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafaf8;
    --line: #e0ddd6;
    --accent: #2d5c4a;
    --accent-soft: #e8f0ec;
    --muted: #6b6b64;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    padding: 40px 24px 80px;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 32px;
    font-family: -apple-system, sans-serif;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    background: white;
  }
  .card h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 14px;
    font-family: -apple-system, sans-serif;
    font-weight: 600;
  }
  input[type="file"] {
    font-family: -apple-system, sans-serif;
    font-size: 0.9rem;
  }
  button {
    font-family: -apple-system, sans-serif;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 0.88rem;
    cursor: pointer;
    margin-left: 10px;
  }
  button:disabled { background: #b5b5ad; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #234a3b; }
  #ingestStatus, #queryStatus {
    font-family: -apple-system, sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 10px;
  }
  .chat {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 16px;
  }
  .msg {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    line-height: 1.55;
    max-width: 90%;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--accent-soft);
    color: var(--ink);
    white-space: pre-wrap;
  }
  .msg.loading {
    align-self: flex-start;
    color: var(--muted);
    font-style: italic;
    font-family: -apple-system, sans-serif;
    font-size: 0.85rem;
  }
  .input-row {
    display: flex;
    gap: 0;
  }
  #questionInput {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: -apple-system, sans-serif;
    font-size: 0.95rem;
  }
  #questionInput:focus { outline: 1px solid var(--accent); }
</style>
</head>
<body>
<div class="app">
  <h1>Study Assistant</h1>
  <p class="subtitle">Upload notes, ask questions, get grounded answers with page citations.</p>

  <div class="card">
    <h2>1. Upload a PDF</h2>
    <input type="file" id="pdfInput" accept="application/pdf">
    <button id="uploadBtn">Ingest</button>
    <div id="ingestStatus"></div>
  </div>

  <div class="card">
    <h2>2. Ask a question</h2>
    <div class="chat" id="chat"></div>
    <div class="input-row">
      <input type="text" id="questionInput" placeholder="What's the difference between TCP and UDP?">
      <button id="askBtn">Ask</button>
    </div>
    <div id="queryStatus"></div>
  </div>
</div>

<script>
  const API_BASE = ""; // same origin — FastAPI serves this file too

  const pdfInput = document.getElementById("pdfInput");
  const uploadBtn = document.getElementById("uploadBtn");
  const ingestStatus = document.getElementById("ingestStatus");
  const questionInput = document.getElementById("questionInput");
  const askBtn = document.getElementById("askBtn");
  const chat = document.getElementById("chat");

  uploadBtn.addEventListener("click", async () => {
    const file = pdfInput.files[0];
    if (!file) { ingestStatus.textContent = "Choose a PDF first."; return; }

    uploadBtn.disabled = true;
    ingestStatus.textContent = "Uploading and ingesting... this can take a minute.";

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch(`${API_BASE}/ingest`, { method: "POST", body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Ingestion failed");
      ingestStatus.textContent = `Done — ${data.chunks_stored} chunks stored from ${data.filename}.`;
    } catch (err) {
      ingestStatus.textContent = `Error: ${err.message}`;
    } finally {
      uploadBtn.disabled = false;
    }
  });

  async function askQuestion() {
    const question = questionInput.value.trim();
    if (!question) return;

    addMessage(question, "user");
    questionInput.value = "";
    askBtn.disabled = true;

    const loadingEl = document.createElement("div");
    loadingEl.className = "msg loading";
    loadingEl.textContent = "Thinking...";
    chat.appendChild(loadingEl);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch(`${API_BASE}/query`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Query failed");
      loadingEl.remove();
      addMessage(data.answer, "assistant");
    } catch (err) {
      loadingEl.remove();
      addMessage(`Error: ${err.message}`, "assistant");
    } finally {
      askBtn.disabled = false;
    }
  }

  function addMessage(text, role) {
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  askBtn.addEventListener("click", askQuestion);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") askQuestion();
  });
</script>
</body>
</html>
